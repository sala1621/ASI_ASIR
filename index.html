
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Pedro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            text-align: center;
            padding: 60px 80px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: aparecer 1.2s ease;
        }

        h1 {
            color: white;
            font-size: 55px;
            margin-bottom: 15px;
        }

        p {
            color: #eeeeff;
            font-size: 20px;
        }

        .emoji {
            font-size: 45px;
            margin-bottom: 20px;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji">👋</div>
        <h1>¡Hola, Pedro!</h1>
        <p>Me alegro de verte por aquí ✨</p>
    </div>

</body>
</html>
